#

# fields omitted here fall back to sane defaults (log_destination:
# .mercurius, max_findings: 6). the project name is derived from the
# directory holding this config file.

max_findings: 6

# review_context is calibration: the stable framing of what kind of review
# this is. state project posture - deployment model, stakes, scope, and the
# simplicity-vs-defensiveness preference. it is true in round one and still
# true in round fourteen. decisions the reviewer should stop raising do NOT
# go here; those are guards, and they live in settled_decisions below.
review_context: |
  personal tool, single supervised implementer. pre-1.0; breaking changes
  are acceptable. prefer simple over highly defensive when both achieve
  correctness. pane is a single binary: the backend is a stateless proxy
  that talks OpenAI-compatible completions directly to the inference
  engine (no gateway layer), and the browser owns all conversation state
  in localStorage. no server-side persistence, no multi-user surface.

# settled_decisions are guards: decisions already made that the reviewer
# should not re-raise. each entry is {id, do_not_flag}. do_not_flag is the
# instruction the reviewer acts on; id is the handle for finding, editing,
# or removing the guard and is never shown to the reviewer. a guard is
# scoped by the argument it closes - when the subject has more than one
# part, say what the guard does NOT cover, or it reads as settling the
# whole surface and what it suppresses produces no output on either side.
# the worst failure mode is bloat: a ledger that grows faster than the
# artifacts slows every cold read without buying anything. mercurius
# re-reads this file at the start of every round, so changes take effect
# next round with no session reopen.
settled_decisions:
  - id: observability-out-of-scope
    do_not_flag: >
      missing production-grade observability or multi-tenant concerns
  - id: display-only-reasoning
    do_not_flag: >
      assistant reasoning being omitted from the re-sent chat history.
      display-only is a settled operator decision: pane re-sends full
      history on every request, so echoing prior turns' reasoning
      multiplies prompt size by thinking length on every turn, for
      unverified benefit. this guard closes the history echo only; the
      upstream wire tolerance, the frontend request-strip handling, and
      the display design all remain reviewable.
  - id: no-thinking-control
    do_not_flag: >
      the absence of user-facing control to enable or disable model
      thinking (no enable_thinking or chat-template knob in the request).
      settled: pane talks to the inference engine directly, with no
      gateway layer such extras would be configured on; whether the model
      thinks is what the model does. closes the control surface only;
      request handling elsewhere remains reviewable.
  - id: wire-spelling-tolerance
    do_not_flag: >
      parsing both `reasoning` and `reasoning_content` upstream delta
      spellings rather than a single canonical field. settled: the
      spelling is the inference engine's to choose and pane tolerates
      both instead of detecting it; a captured stream will confirm which
      is on the wire. closes upstream spelling tolerance only; pane's own
      field naming and the sse event shape remain reviewable.

# review_focus directs the reviewer at arc-specific surfaces that the base
# review philosophy does not already cover. it is arc-scoped: rewrite it
# when a new arc's artifacts replace the ones under review, and re-check
# it between rounds as decisions settle.
review_focus: |
  this arc is the thinking display feature: docs/future/thinking.md (spec)
  and docs/future/thinking-work-order.md (work order). invariants the base
  criteria do not cover: no reasoning byte may reach the upstream request
  body on any path, including tool-loop re-send rounds and retries - the
  guarantee is type-level, llm.Message carries no reasoning field. the
  round_complete sse payload is unchanged in shape; the backend is
  pass-through only and the frontend owns reasoning from stream to
  committed message to localStorage. a response with no thinking tokens
  changes nothing the reader sees. the register split - `reasoning` on the
  wire and in go, `thinking` in the sse protocol and the ui - holds
  everywhere. collapse state is per message and survives reload.

reviewer:
  name: codex
  impl: codex
  model: gpt-5.6-sol